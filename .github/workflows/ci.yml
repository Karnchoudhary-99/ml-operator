name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - run: for t in examples/*-tour.sh; do bash "$t"; done
