apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modeldeployments.ml.example.com
spec:
  group: ml.example.com
  names:
    kind: ModelDeployment
    listKind: ModelDeploymentList
    plural: modeldeployments
    singular: modeldeployment
    shortNames:
      - mldep
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: string
          jsonPath: .status.readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Desired state of a deployed model.
              required:
                - model
              properties:
                model:
                  type: object
                  description: The model artifact to serve.
                  required:
                    - image
                  properties:
                    image:
                      type: string
                      description: Container image serving the model, e.g. "registry.example.com/iris-mlp:v2".
                    framework:
                      type: string
                      description: Serving runtime (e.g. "onnx", "torchserve", "triton", "custom"). Only used for the default readiness path when health.path is empty.
                    version:
                      type: string
                      description: Model version label, recorded in status and metrics.
                replicas:
                  type: integer
                  description: Desired pod count. Empty means the default (1). Autoscaling, when enabled, overrides this at runtime.
                  minimum: 0
                resources:
                  type: object
                  description: Per-pod CPU/memory requests and limits, as Kubernetes quantities ("500m", "1Gi").
                  properties:
                    cpuRequest:
                      type: string
                      description: CPU request, e.g. "500m".
                    cpuLimit:
                      type: string
                      description: CPU limit, e.g. "2". Must be >= cpuRequest.
                    memoryRequest:
                      type: string
                      description: Memory request, e.g. "512Mi".
                    memoryLimit:
                      type: string
                      description: Memory limit, e.g. "1Gi". Must be >= memoryRequest.
                port:
                  type: integer
                  description: Container port the model server listens on. Default 8080.
                  minimum: 1
                  maximum: 65535
                strategy:
                  type: string
                  description: How a new model revision replaces the old one. Default RollingUpdate.
                  enum:
                    - Recreate
                    - RollingUpdate
                    - Canary
                    - BlueGreen
                canary:
                  type: object
                  description: Canary rollout configuration. Required when strategy is Canary, ignored otherwise.
                  required:
                    - weight
                  properties:
                    weight:
                      type: integer
                      description: Initial percentage of traffic sent to the new revision (1-99). The operator steps it up after each health gate passes.
                      minimum: 1
                      maximum: 99
                    steps:
                      type: integer
                      description: Number of traffic increments to reach 100%. 0 means a single step (weight straight to 100% after the gate).
                      minimum: 0
                    intervalSeconds:
                      type: integer
                      description: Pause between steps, in seconds.
                      minimum: 0
                    gate:
                      type: object
                      description: Health-gate thresholds for this rollout. A zero field takes the operator default; it never disables its check.
                      properties:
                        maxErrorRate:
                          type: number
                          description: Maximum tolerated error fraction (0-1). 0 means the default (5%).
                          minimum: 0
                          maximum: 1
                        maxP95LatencyMs:
                          type: number
                          description: Maximum tolerated p95 latency in milliseconds. 0 means the default (500ms).
                          minimum: 0
                        minReadyRatio:
                          type: number
                          description: Minimum ready/desired replicas (0-1). 0 means the default (1.0, every pod ready).
                          minimum: 0
                          maximum: 1
                blueGreen:
                  type: object
                  description: Blue-green rollout configuration. Optional when strategy is BlueGreen (absent means the operator defaults); ignored otherwise.
                  properties:
                    gate:
                      type: object
                      description: Health-gate thresholds for this rollout. A zero field takes the operator default; it never disables its check.
                      properties:
                        maxErrorRate:
                          type: number
                          description: Maximum tolerated error fraction (0-1). 0 means the default (5%).
                          minimum: 0
                          maximum: 1
                        maxP95LatencyMs:
                          type: number
                          description: Maximum tolerated p95 latency in milliseconds. 0 means the default (500ms).
                          minimum: 0
                        minReadyRatio:
                          type: number
                          description: Minimum ready/desired replicas (0-1). 0 means the default (1.0, every pod ready).
                          minimum: 0
                          maximum: 1
                autoscaling:
                  type: object
                  description: Horizontal autoscaling for this model. minReplicas must be <= maxReplicas, and at least one of targetCPUUtilization / targetRequestsPerSecond must be set — enforced by the operator, not the schema.
                  properties:
                    minReplicas:
                      type: integer
                      description: Floor. 0 means unset (defaults to 1).
                      minimum: 0
                    maxReplicas:
                      type: integer
                      description: Ceiling; must be >= minReplicas.
                      minimum: 1
                    targetCPUUtilization:
                      type: integer
                      description: Average CPU percentage that triggers scaling (1-100). 0 disables CPU-based scaling.
                      minimum: 0
                      maximum: 100
                    targetRequestsPerSecond:
                      type: integer
                      description: Per-pod request rate that triggers scaling. 0 disables RPS-based scaling.
                      minimum: 0
                availability:
                  type: object
                  description: How the operator keeps the model serving through voluntary disruptions and spreads its pods across nodes. Absent means the operator defaults (anti-affinity on, maxSkew 1, minAvailable replicas-1). minAvailable must be < replicas — enforced by the operator, not the schema.
                  properties:
                    minAvailable:
                      type: integer
                      description: Pods that must stay available during a voluntary disruption. 0 means the default (replicas-1).
                      minimum: 0
                    antiAffinity:
                      type: boolean
                      description: Keep pods of one deployment off the same node. Absent means the default (true).
                    maxSkew:
                      type: integer
                      description: 'Topology-spread maxSkew: the most pods any one node may hold above the least-loaded node. 0 means the default (1).'
                      minimum: 0
                      maximum: 10
                security:
                  type: object
                  description: Pod- and container-level security context for the model's serving pods. Absent means the operator defaults (non-root uid 10001, read-only root filesystem, no privilege escalation, all capabilities dropped, RuntimeDefault seccomp). A uid of 0 with runAsNonRoot on is a contradiction — enforced by the operator, not the schema.
                  properties:
                    runAsNonRoot:
                      type: boolean
                      description: Refuse to start the pod if any container would run as uid 0. Absent means the default (true).
                    runAsUser:
                      type: integer
                      description: Uid every container runs as. Absent means the default (10001). 0 is only legal with runAsNonRoot false.
                      minimum: 0
                      maximum: 4294967295
                    readOnlyRootFilesystem:
                      type: boolean
                      description: Mount the container's root filesystem read-only. Absent means the default (true).
                    allowPrivilegeEscalation:
                      type: boolean
                      description: Let a process gain more privileges than its parent. Absent means the default (false).
                    dropCapabilities:
                      type: array
                      description: Linux capabilities removed from the container's bounding set. Absent or empty means the default (["ALL"]).
                      items:
                        type: string
                        description: One capability name, e.g. "ALL" or "NET_BIND_SERVICE".
                    seccompProfile:
                      type: string
                      description: 'Seccomp profile for the pod: "RuntimeDefault", "Unconfined", or "Localhost/<profile>". Empty means the default ("RuntimeDefault").'
                env:
                  type: object
                  description: Extra environment variables for the model container. Keys must match [A-Za-z_][A-Za-z0-9_]*.
                  additionalProperties:
                    type: string
                health:
                  type: object
                  description: Readiness gate for the model container.
                  properties:
                    path:
                      type: string
                      description: HTTP readiness endpoint, e.g. "/healthz". Must start with '/'. Empty takes the framework default.
                    initialDelaySeconds:
                      type: integer
                      description: Wait after container start before the first probe.
                      minimum: 0
                    periodSeconds:
                      type: integer
                      description: Probe interval, in seconds.
                      minimum: 0
                paused:
                  type: boolean
                  description: 'Suspend reconciliation while true: the operator makes no cluster changes, advances no rollout, and applies no autoscaling decision. Live objects keep serving as they are; resume by setting false. Default false.'
            status:
              type: object
              description: Observed state of a deployed model.
              properties:
                phase:
                  type: string
                  description: Lifecycle phase of the deployment.
                  enum:
                    - Pending
                    - Progressing
                    - Available
                    - Degraded
                    - Failed
                readyReplicas:
                  type: integer
                  description: Number of pods passing the readiness gate.
                  minimum: 0
                observedGeneration:
                  type: integer
                  description: Last spec generation the operator acted on.
                  minimum: 0
                message:
                  type: string
                  description: Human-readable summary of the current state.
                previousImage:
                  type: string
                  description: Container image the stable Deployment served before the current one. Empty until the first image change; `mlop rollback` restores it.
                previousVersion:
                  type: string
                  description: Model version label that went with previousImage.
                conditions:
                  type: array
                  description: Latest condition per type (Ready, Progressing, Available), following the Kubernetes condition conventions.
                  items:
                    type: object
                    description: One status condition.
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                        description: Condition type, e.g. "Ready".
                      status:
                        type: string
                        description: Condition status.
                        enum:
                          - 'True'
                          - 'False'
                          - Unknown
                      reason:
                        type: string
                        description: Short machine-readable reason for the current status.
                      message:
                        type: string
                        description: Human-readable detail.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Last time the status value changed.
