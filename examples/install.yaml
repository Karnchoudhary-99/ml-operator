apiVersion: v1
kind: Namespace
metadata:
  name: ml-operator-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-operator
  namespace: ml-operator-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ml-operator
rules:
  - apiGroups:
      - ml.example.com
    resources:
      - modeldeployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ml.example.com
    resources:
      - modeldeployments/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ml-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ml-operator
subjects:
  - kind: ServiceAccount
    name: ml-operator
    namespace: ml-operator-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-operator
  namespace: ml-operator-system
  labels:
    app: ml-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-operator
  template:
    metadata:
      labels:
        app: ml-operator
    spec:
      serviceAccountName: ml-operator
      containers:
        - name: operator
          image: ghcr.io/karnchoudhary-99/ml-operator:v0.1.0
          args:
            - '--namespace=default'
            - '--metrics-addr=:8080'
            - '--reconcile-interval=30s'
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
