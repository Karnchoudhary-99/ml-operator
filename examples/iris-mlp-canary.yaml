# Canary rollout manifest for the mlop tour: v2 of iris-mlp ships
# behind a 10% canary with a single step to 100% (steps: 0) and a
# 1-second step interval, so the tour runs in seconds. The gate is
# tighter than the operator defaults (2% errors instead of 5%),
# because iris-mlp is latency-sensitive in this example.
name: iris-mlp
namespace: default
spec:
  model:
    image: registry.example.com/iris-mlp:v2
    framework: onnx
    version: v2
  replicas: 2
  strategy: Canary
  canary:
    weight: 10
    steps: 0
    intervalSeconds: 1
    gate:
      maxErrorRate: 0.02
      maxP95LatencyMs: 250
      minReadyRatio: 1.0
