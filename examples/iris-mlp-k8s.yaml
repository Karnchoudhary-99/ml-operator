# Same model as iris-mlp.yaml, in Kubernetes object shape for
# kubectl apply against a cluster with the CRD installed
# (mlop crd | kubectl apply -f -). The spec fields are the same
# ones mlop apply reads; only the envelope differs.
apiVersion: ml.example.com/v1alpha1
kind: ModelDeployment
metadata:
  name: iris-mlp
  namespace: default
spec:
  model:
    image: registry.example.com/iris-mlp:v1
    framework: onnx
    version: v1
  replicas: 2
  resources:
    cpuRequest: 500m
    cpuLimit: "1"
    memoryRequest: 512Mi
    memoryLimit: 1Gi
  port: 8080
  strategy: RollingUpdate
  health:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
