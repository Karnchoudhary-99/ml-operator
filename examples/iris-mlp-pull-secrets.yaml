# Minimal ModelDeployment manifest with image pull secrets:
# the pods pull the serving image with the registry
# credentials in the regcred and ghcr-creds secrets. The YAML
# dialect writes the list as a comma-separated string; JSON
# manifests carry a real array. Deployments without pull
# secrets omit the field entirely and pull without
# credentials.
name: iris-mlp
namespace: default
spec:
  model:
    image: registry.example.com/iris-mlp:v1
    framework: onnx
    version: v1
  replicas: 2
  resources:
    cpuRequest: 500m
    cpuLimit: "1"
    memoryRequest: 512Mi
    memoryLimit: 1Gi
  port: 8080
  strategy: RollingUpdate
  imagePullSecrets: regcred, ghcr-creds
  health:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
